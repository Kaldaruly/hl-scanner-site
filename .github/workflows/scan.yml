name: hourly-scan

on:
  schedule:
    - cron: "7 * * * *"   # каждый час в :07 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # код сканера лежит в приватном репо, тянем его read-only ключом
      - uses: actions/checkout@v4
        with:
          repository: Kaldaruly/hl-scanner
          ssh-key: ${{ secrets.SCANNER_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scanner.run
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
